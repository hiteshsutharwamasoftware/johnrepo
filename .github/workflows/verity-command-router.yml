name: Verity Command Router

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  actions: write

jobs:
  route:
    if: ${{ !github.event.issue.pull_request && contains(github.event.comment.body, '/codex') && vars.VERITY_ENABLE_COMMAND_ROUTER == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YAML parser
        run: python -m pip install --upgrade pip pyyaml

      - name: Load .verity/config.yml
        id: cfg
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          cfg = yaml.safe_load(Path('.verity/config.yml').read_text()) or {}
          verity = cfg.get('verity', {}) or {}
          out = os.environ['GITHUB_OUTPUT']
          with open(out, 'a', encoding='utf-8') as f:
            f.write(f"project_id={str(verity.get('project_id', '')).strip()}\n")
            f.write(f"callback_url={str(verity.get('callback_url', '')).strip()}\n")
          PY

      - name: Dispatch codex-dev-cycle
        uses: actions/github-script@v7
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CALLBACK_URL: ${{ steps.cfg.outputs.callback_url }}
          VERITY_PROJECT_ID: ${{ steps.cfg.outputs.project_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const body = process.env.COMMENT_BODY || '';
            const cleaned = body.replace(/\/codex\b/i, '').trim();
            const issueNumber = Number(process.env.ISSUE_NUMBER || '0');
            const callbackUrl = process.env.CALLBACK_URL || '';
            const projectId = process.env.VERITY_PROJECT_ID || '';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.payload.repository.default_branch || 'main';

            const inputs = {
              issue_number: issueNumber ? String(issueNumber) : '',
              user_request: cleaned,
              callback_url: callbackUrl,
              verity_project_id: projectId,
            };

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'codex-dev-cycle.yml',
              ref,
              inputs,
            });

            core.info(`Dispatched codex-dev-cycle.yml for issue #${issueNumber}`);
