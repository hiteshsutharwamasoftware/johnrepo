name: Verity Guardrails

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run OpenAI guardrail (if enabled)
        run: |
          python scripts/check_no_direct_openai.py
