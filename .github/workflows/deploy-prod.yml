name: Deploy Verity Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/SHA) to deploy. Defaults to the selected branch head."
        required: false
        default: ""

concurrency:
  group: verity-prod-stack-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_NAME: verity-prod
  DEPLOY_ENV: prod
  PREBUILD_CLEANUP_SCOPE: full-reset

  # Vercel (BlueSky team)
  VERCEL_SCOPE: blue-sky-2a272df1
  VERCEL_ORG_ID: team_cP4qrtxttKW73Upzzx5YCMye
  VERCEL_FRONTEND_PROJECT_ID: prj_PnjxMY1oJwVN2rD33HhrURE83rPx
  VERCEL_WIDGET_PROJECT_ID: prj_FGOCi7swewrDuaesU1nhnB66kKJH
  VERCEL_WIDGET_BASE_URL: https://verity-widgets.vercel.app
  VERCEL_DEPLOY_TARGET: production
  VERCEL_FORCE: true
  VERCEL_PURGE_CDN: false

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      id-token: write
      contents: read
    outputs:
      api_url: ${{ steps.api_url.outputs.api_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Clean disposable build artifacts
        run: |
          set -euo pipefail

          cleanup_targets=(
            ".aws-sam"
            ".sam-appdata"
            ".tmp-sam-appdata"
            ".tmp-appdata"
            ".verify-appdata"
          )

          if [ "${PREBUILD_CLEANUP_SCOPE}" = "sam-and-build" ] || [ "${PREBUILD_CLEANUP_SCOPE}" = "full-reset" ]; then
            cleanup_targets+=(
              "backend/dist"
              "frontend/dist"
              "widget/dist"
            )
          fi

          if [ "${PREBUILD_CLEANUP_SCOPE}" = "full-reset" ]; then
            cleanup_targets+=(
              "node_modules"
              "backend/node_modules"
              "frontend/node_modules"
              "widget/node_modules"
            )
          fi

          for target in "${cleanup_targets[@]}"; do
            if [ -e "${target}" ]; then
              echo "Removing ${target}"
              rm -rf "${target}"
            else
              echo "Skipping ${target}; not present"
            fi
          done

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Build backend
        run: |
          cd backend
          npm run build

      - name: Use repo esbuild for SAM
        run: |
          ESBUILD_DIR="${GITHUB_WORKSPACE}/backend/node_modules/.bin"
          echo "${ESBUILD_DIR}" >> $GITHUB_PATH
          export PATH="${ESBUILD_DIR}:$PATH"
          esbuild --version
          sam --version

      - name: SAM Build
        run: sam build --template-file template.yaml --cached --build-in-source

      - name: SAM Deploy
        run: |
          set -euo pipefail

          GITHUB_APP_SECRET_NAME="${{ secrets.VERITY_GITHUB_APP_SECRET_NAME }}"
          if [ -z "${GITHUB_APP_SECRET_NAME}" ]; then
            GITHUB_APP_SECRET_NAME="github-app"
          fi

          GITHUB_APP_SLUG="${{ secrets.VERITY_GITHUB_APP_SLUG }}"
          if [ -z "${GITHUB_APP_SLUG}" ]; then
            echo "VERITY_GITHUB_APP_SLUG secret is required." >&2
            exit 1
          fi

          PARAMS=(
            "Environment=${DEPLOY_ENV}"
            "VerityGitHubAppSecretName=${GITHUB_APP_SECRET_NAME}"
            "VerityGitHubAppSlug=${GITHUB_APP_SLUG}"
            "UseExistingPlaywrightLayer=true"
            "ExistingPlaywrightLayerArn=arn:aws:lambda:us-east-1:335274137096:layer:playwright-layer:34"
          )

          if [ -n "${{ secrets.FEEDBACK_APP_URL }}" ]; then
            PARAMS+=("FeedbackAppUrl=${{ secrets.FEEDBACK_APP_URL }}")
          fi

          if [ -n "${{ secrets.VERITY_GITHUB_ACTIONS_CALLBACK_URL }}" ]; then
            PARAMS+=("VerityGitHubActionsCallbackUrl=${{ secrets.VERITY_GITHUB_ACTIONS_CALLBACK_URL }}")
          fi

          sam deploy \
            --stack-name "${STACK_NAME}" \
            --parameter-overrides "${PARAMS[@]}" \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM

      - name: Get API URL
        id: api_url
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name ${STACK_NAME} \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          API_URL="$(echo "${API_URL}" | sed 's:/*$::')"
          echo "api_url=${API_URL}" >> $GITHUB_OUTPUT

  deploy-vercel:
    runs-on: ubuntu-latest
    environment:
      name: production
    needs: deploy-backend
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy frontend + widget to Vercel
        env:
          API_URL: ${{ needs.deploy-backend.outputs.api_url }}
          AWS_STACK_NAME: ${{ env.STACK_NAME }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "VERCEL_TOKEN secret is required." >&2
            exit 1
          fi
          bash ./scripts/deploy-vercel.sh
