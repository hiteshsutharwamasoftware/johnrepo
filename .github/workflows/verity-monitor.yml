name: Verity Monitor (Scheduled)

on:
  schedule:
    - cron: "0 3 * * *" # daily 03:00 UTC
  workflow_dispatch:
    inputs:
      dispatch_test_to_issue:
        description: "Dispatch codex-test-to-issue workflow when tests fail (true/false)"
        required: false
        default: "false"
      dispatch_dev_cycle:
        description: "Dispatch codex-dev-cycle workflow when tests fail (true/false)"
        required: false
        default: "false"

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YAML parser
        run: python -m pip install --upgrade pip pyyaml

      - name: Load .verity/config.yml
        id: cfg
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          cfg = yaml.safe_load(Path('.verity/config.yml').read_text()) or {}
          commands = cfg.get('commands', {}) or {}

          def norm_list(v):
            if v is None: return []
            if isinstance(v, list): return [str(x) for x in v if str(x).strip()]
            if isinstance(v, str) and v.strip(): return [v.strip()]
            return []

          out = os.environ['GITHUB_OUTPUT']
          with open(out, 'a', encoding='utf-8') as f:
            f.write('test_cmds<<EOF\n' + '\n'.join(norm_list(commands.get('test'))) + '\nEOF\n')
          PY

      - name: Run configured tests
        id: tests
        continue-on-error: true
        run: |
          set -euo pipefail
          : > monitor-test-output.txt
          if [ -z "${{ steps.cfg.outputs.test_cmds }}" ]; then
            echo "No commands.test configured in .verity/config.yml" | tee -a monitor-test-output.txt
            exit 1
          fi
          while IFS= read -r cmd; do
            [ -z "$cmd" ] && continue
            echo "=== RUN: $cmd" | tee -a monitor-test-output.txt
            bash -lc "$cmd" 2>&1 | tee -a monitor-test-output.txt
            echo "" | tee -a monitor-test-output.txt
          done <<< "${{ steps.cfg.outputs.test_cmds }}"

      - name: Create escalation issue on failure
        if: ${{ steps.tests.outcome != 'success' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const title = `Verity monitor: failing checks (${new Date().toISOString().slice(0,10)})`;
            const body = [
              'Scheduled monitor detected failing test command(s).',
              '',
              `Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              '',
              'If full-auto is enabled in Verity, consider dispatching codex-test-to-issue or codex-dev-cycle.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['verity:monitor', 'verity:agent'],
            });

      - name: Dispatch codex-test-to-issue on failure (full-auto/manual opt-in)
        if: ${{ steps.tests.outcome != 'success' && (inputs.dispatch_test_to_issue == 'true' || vars.VERITY_MONITOR_AUTO_TEST_TO_ISSUE == 'true') }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'codex-test-to-issue.yml',
              ref: context.payload.repository?.default_branch || 'main',
              inputs: {
                sha: process.env.GITHUB_SHA,
              },
            });

      - name: Dispatch codex-dev-cycle on failure (full-auto/manual opt-in)
        if: ${{ steps.tests.outcome != 'success' && (inputs.dispatch_dev_cycle == 'true' || vars.VERITY_MONITOR_AUTO_DEV_CYCLE == 'true') }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'codex-dev-cycle.yml',
              ref: context.payload.repository?.default_branch || 'main',
              inputs: {
                user_request: 'Monitor detected failing tests. Investigate and propose a safe fix.',
              },
            });

      - name: Upload monitor artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verity-monitor
          path: monitor-test-output.txt
          if-no-files-found: ignore
